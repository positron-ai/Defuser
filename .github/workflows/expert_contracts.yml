name: Expert Contracts

on:
  pull_request:
    paths:
      - 'defuser/**'
      - 'tests/test_compatibility.py'
      - 'tests/test_moe_experts_interface.py'
      - 'tests/test_muse_spark_experts.py'
      - 'pyproject.toml'
      - '.github/workflows/expert_contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14']
        transformers: ['5.12.1', '5.15.1', '5.16.1', '5.20.1']
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies and wheel
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build pytest pytest-xdist "transformers==${{ matrix.transformers }}"
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Test expert contracts
        run: |
          mkdir -p "$RUNNER_TEMP/defuser-contracts"
          cp tests/test_compatibility.py tests/test_moe_experts_interface.py tests/test_muse_spark_experts.py "$RUNNER_TEMP/defuser-contracts/"
          cd "$RUNNER_TEMP/defuser-contracts"
          python -m pytest -q -c /dev/null test_compatibility.py test_moe_experts_interface.py test_muse_spark_experts.py
          python -m pytest -q -c /dev/null -p xdist.plugin -n 8 test_compatibility.py test_moe_experts_interface.py test_muse_spark_experts.py
